# GitLab CI — ColombIA Datos (Equipo 194)

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - src/node_modules/

web:
  stage: test
  image: node:20
  script:
    - cd src
    - npm ci
    - npm run lint

python:
  stage: test
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pytest tests/ -v
    - python pipelines/pipeline_ml.py
