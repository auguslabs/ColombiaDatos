<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#003594" />
      <stop offset="100%" stop-color="#001845" />
    </radialGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE054" />
      <stop offset="100%" stop-color="#FFCD00" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056D2" />
      <stop offset="100%" stop-color="#003087" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B5C" />
      <stop offset="100%" stop-color="#C8102E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Smooth rounded square container mimicking a polished app icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" />

  <!-- Glowing AI Sparkle in the center -->
  <g transform="translate(256, 230) scale(1.15)" filter="url(#glow)">
    <!-- Main white sparkle -->
    <path d="M0,-100 C2,-35 35,-2 100,0 C35,2 2,35 0,100 C-2,35 -35,2 -100,0 C-35,-2 -2,-35 0,-100 Z" fill="#FFFFFF" />
    
    <!-- Auxiliary Colombia-colored mini-sparkles representing data intelligence nodes -->
    <path d="M50,-50 C51,-15 65,-1 80,0 C65,1 51,15 50,50 C49,15 35,1 0,0 C35,-1 49,-15 50,-50 Z" fill="url(#yellowGrad)" transform="scale(0.35) translate(140, -120)" />
    <path d="M-50,50 C-49,15 -35,1 0,0 C-35,-1 -49,-15 -50,-50 C-51,-15 -65,-1 -80,0 C-65,1 -51,15 -50,50 Z" fill="url(#redGrad)" transform="scale(0.3) translate(-160, 160)" />
  </g>

  <!-- Colombian Tricolor curved ribbon/data-wave at the bottom -->
  <path d="M 100 420 Q 256 360 412 420" fill="none" stroke="url(#yellowGrad)" stroke-width="20" stroke-linecap="round" />
  <path d="M 115 442 Q 256 385 397 442" fill="none" stroke="url(#blueGrad)" stroke-width="10" stroke-linecap="round" />
  <path d="M 130 460 Q 256 405 382 460" fill="none" stroke="url(#redGrad)" stroke-width="10" stroke-linecap="round" />
</svg>
